name: GabyFit Android staging APK
on:
  workflow_dispatch:
  push:
    paths: ['android/GabyFitSync/**', '.github/workflows/gabyfit-android.yml']
  pull_request:
    paths: ['android/GabyFitSync/**', '.github/workflows/gabyfit-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/GabyFitSync
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Gradle 8.11.1 with checksum validation
        run: |
          curl --fail --location https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          curl --fail --location https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 -o /tmp/gradle.sha256
          printf '%s  /tmp/gradle.zip\n' "$(cat /tmp/gradle.sha256)" | sha256sum --check
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Validate wearable contract, UI syntax and SQLite deduplication
        working-directory: ${{ github.workspace }}
        run: |
          node integration/wearables/contract.test.mjs
          python3 integration/wearables/schema_test.py
      - name: Compile and lint
        run: /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK and record source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GabyFitSync-staging.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/GabyFitSync-staging.apk > dist/APK-SIGNATURE.txt
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE-COMMIT.txt
          cd dist
          sha256sum GabyFitSync-staging.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GabyFitSync-staging-apk
          path: android/GabyFitSync/dist/*
          if-no-files-found: error
          retention-days: 90
  durable-download:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gabyfit-health-connect-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GabyFitSync-staging-apk
          path: dist
      - name: Publish persistent prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="gabyfit-sync-staging-${SOURCE_SHA:0:12}"
          printf 'APK de pruebas para staging. Commit: %s. No probado todavía en teléfono físico. No contiene credenciales. Descargas conservadas como assets de Release, sin caducidad automática de Actions.\n' "$SOURCE_SHA" > notes.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title "GabyFit Sync staging ${SOURCE_SHA:0:12}" --notes-file notes.txt
          fi
          gh release upload "$TAG" dist/* --clobber
