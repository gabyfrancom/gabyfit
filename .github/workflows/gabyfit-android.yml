name: GabyFit Android APK (diagnostic)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/GabyFitSync/**'
      - '.github/workflows/gabyfit-android.yml'
  pull_request:
    paths:
      - 'android/GabyFitSync/**'
      - '.github/workflows/gabyfit-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/GabyFitSync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Assemble debug APK
        run: /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GabyFitSync-debug-apk
          path: android/GabyFitSync/app/build/outputs/apk/debug/*.apk
          retention-days: 7
